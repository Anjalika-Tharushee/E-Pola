<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=index.html#shop" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | Pola</title>
    <script>
      const destination = new URL("index.html", location.href);
      const query = new URLSearchParams(location.search);
      destination.hash = query.size ? `shop?${query.toString()}` : "shop";
      location.replace(destination.href);
    </script>
  </head>
  <body><p>Opening the shop… <a href="index.html#shop">Continue to Pola</a></p></body>
</html>
